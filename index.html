<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rise × Testing Floor</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111; color: #aaa; font: 12px system-ui, sans-serif; }
      #content { position: fixed; inset: 0 0 32px; display: grid; place-items: center; }
      canvas { image-rendering: pixelated; }
      footer { position: fixed; inset: auto 0 0; height: 32px; padding: 4px 8px; display: flex; gap: 10px; align-items: center; justify-content: center; background: #111; }
      a { color: inherit; }
      button { font: inherit; color: inherit; background: transparent; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
    </style>
</head>

<body>
    <div id="content"></div>
    <footer>
      <span><a href="https://zzox.itch.io/rise">rise by zzox</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0 art</a></span>
      <a href="https://testingfloor.com">Testing Floor</a>
      <a href="https://github.com/capitalisminc/testingfloor-demo-rise">Source</a>
      <button id="mute" type="button" aria-pressed="false">Mute</button>
    </footer>
    <script type="module" src="/src/index.js"></script>
</body>
</html>
