name: Check example

on:
  push:
    branches: [testing-floor]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The published example sends to Testing Floor with the repository's
      # TESTING_FLOOR_WRITE_KEY variable; without it, the build keeps the local stub.
      - run: npm run build
        env:
          VITE_TESTING_FLOOR_WRITE_KEY: ${{ vars.TESTING_FLOOR_WRITE_KEY }}
      - run: npm run maps && git diff --exit-code -- maps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/testing-floor'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing-floor'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
